name: MistySteps
options:
  bundleIdPrefix: com.potloodgum
  deploymentTarget:
    iOS: "17.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  MistySteps:
    type: application
    platform: iOS
    info:
      path: MistySteps/Info.plist
      properties:
        # Compose Multiplatform on iOS aborts at start without this.
        CADisableMinimumFrameDurationOnPhone: true
        # A walk keeps recording with the screen locked (location updates run only while a walk is on; see LocationModel).
        UIBackgroundModes: [location]
        NSPhotoLibraryAddUsageDescription: Misty Steps saves your postcard to Photos when you tap Save.
    sources:
      - MistySteps
      # The same style template and glyphs the Android app uses; one copy in the repo.
      - path: ../app/src/main/assets/maps
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/characters.txt
        buildPhase: resources
      - path: ../app/src/main/assets/nl-index.json
        buildPhase: resources
      - path: ../app/src/main/assets/pins.txt
        buildPhase: resources
      - path: ../app/src/main/assets/nl-provinces.json
        buildPhase: resources
    dependencies:
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.potloodgum.mistysteps
        DEVELOPMENT_TEAM: P9KK68PA63
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: Misty Steps
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_CFBundleDisplayName: Misty Steps
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Misty Steps shows where you are on the map and clears the fog as you walk. While a walk is on, it keeps clearing the fog with the screen locked.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "-framework Shared"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME=${JAVA_HOME:-/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home}
          export PATH="$JAVA_HOME/bin:$PATH"
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
